<script>
'use strict';
const problems=JSON.parse(document.getElementById('dataset').textContent).problems,$=id=>document.getElementById(id);let visible=[],active=problems.some(p=>p.id===location.hash.slice(1))?location.hash.slice(1):problems[0].id;
const short=p=>p.id.replace('IMO-SL-','').replace('-',' · ');
for(const year of [...new Set(problems.map(p=>p.id.match(/\d{4}/)[0]))]){$('year').add(new Option(year,year));}
function select(id,updateURL=true){active=id;render();if(updateURL&&id)history.replaceState(null,'','#'+id);}
function render(){const p=visible.find(p=>p.id===active);$('current').hidden=!p;$('empty').hidden=!!p;const i=visible.indexOf(p);$('previous').disabled=i<=0;$('next').disabled=i<0||i===visible.length-1;$('picker').value=active||'';for(const a of $('list').children)a.setAttribute('aria-current',String(a.dataset.id===active));if(!p)return;$('title').textContent=short(p);$('position').textContent='Geometry · '+(i+1)+' of '+visible.length;$('statement').textContent=p.statement;$('drawing').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(p.svg);$('drawing').alt='Geometry construction for '+short(p)+'. Refer to the adjacent statement for the construction definitions.';$('scope-text').textContent=p.note||'This representative drawing awaits verification.';}
function filter(){const q=$('search').value.trim().toLowerCase(),year=$('year').value;visible=problems.filter(p=>(year==='all'||p.id.includes(year))&&(!q||(p.id+' '+p.statement).toLowerCase().includes(q)));$('count').textContent=visible.length+' problems · newest first';$('list').replaceChildren();$('picker').replaceChildren();for(const p of visible){const a=document.createElement('a');a.href='#'+p.id;a.dataset.id=p.id;const y=document.createElement('span'),n=document.createElement('span');y.className='year';n.className='number';y.textContent=p.id.match(/\d{4}/)[0];n.textContent=p.id.replace(/^.*?\d{4}-/,'');a.append(y,n);a.onclick=e=>{e.preventDefault();select(p.id)};$('list').append(a);$('picker').add(new Option(short(p),p.id));}if(!visible.some(p=>p.id===active))active=visible[0]?.id;render();}
function step(delta){const i=visible.findIndex(p=>p.id===active),p=visible[i+delta];if(p){select(p.id);$('list').querySelector('[aria-current=true]')?.scrollIntoView({block:'nearest'});}}
$('search').oninput=filter;$('year').onchange=filter;$('picker').onchange=()=>select($('picker').value);$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('reset').onclick=()=>{$('search').value='';$('year').value='all';filter()};$('enlarge').onclick=()=>{$('zoom-title').textContent=short(problems.find(p=>p.id===active));$('zoom-image').src=$('drawing').src;$('zoom-image').alt=$('drawing').alt;$('zoom').showModal()};$('close').onclick=()=>$('zoom').close();window.addEventListener('hashchange',()=>{if(problems.some(p=>p.id===location.hash.slice(1))){$('search').value='';$('year').value='all';active=location.hash.slice(1);filter()}});filter();
</script></body></html>
